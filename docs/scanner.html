<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <title>ARViewer - AR Scanner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="ar-page">
  <div class="ar-container">
    <video id="ar-video" playsinline></video>
    <canvas id="scan-canvas" class="hidden"></canvas>
    <canvas id="ar-canvas"></canvas>

    <div class="ar-ui">
      <div class="ar-header">
        <a href="index.html" class="ar-back">&larr;</a>
        <span id="ar-status">Scanning for QR codes...</span>
      </div>
      <div id="ar-model-name" class="ar-model-name hidden"></div>
    </div>

    <div class="ar-reticle" id="ar-reticle">
      <div class="reticle-corner tl"></div>
      <div class="reticle-corner tr"></div>
      <div class="reticle-corner bl"></div>
      <div class="reticle-corner br"></div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script type="module" src="js/scanner.js"></script>
</body>
</html>
