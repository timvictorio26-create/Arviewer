<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f97316">
  <link rel="manifest" href="manifest.json">
  <title>ARViewer - Walkthrough</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="viewer-page">
  <div class="walkthrough-container">
    <canvas id="viewer-canvas"></canvas>

    <div class="walkthrough-header">
      <a href="index.html" class="back-link">&larr;</a>
      <h1 id="viewer-title">Loading...</h1>
    </div>

    <div id="walkthrough-start" class="walkthrough-start">
      <div class="walkthrough-start-content">
        <h2>3D Walkthrough</h2>
        <p id="walkthrough-instructions">Click to enter.</p>
        <button id="walkthrough-start-btn" class="btn btn-primary btn-large">Enter Walkthrough</button>
      </div>
    </div>

    <div id="mobile-controls" class="mobile-controls hidden">
      <div id="joystick" class="joystick">
        <div id="joystick-thumb" class="joystick-thumb"></div>
      </div>
      <div class="vertical-buttons">
        <button id="btn-up" class="vert-btn">&#9650;</button>
        <button id="btn-down" class="vert-btn">&#9660;</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/viewer.js"></script>
</body>
</html>
